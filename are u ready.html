<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quest Intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}

body{
  height:100vh;
  width:100vw;
  background: url("ready_for_quest.jpg") no-repeat center center/cover;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🌌 Stars */
.stars{
  position:absolute;
  width:200%;
  height:200%;
  background: radial-gradient(#fff 1px, transparent 1px);
  background-size:3px 3px;
  animation: starsMove 60s linear infinite;
  opacity:0.25;
}

@keyframes starsMove{
  to{ transform:translate(-500px,-500px); }
}

/* Glass panel */
.overlay{
  position:relative;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  padding:50px 80px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 50px rgba(0,255,200,0.35);
  z-index:2;
}

/* 🎮 Quest text */
.quest-title{
  font-size:2.8rem;
  font-weight:900;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:35px;

  text-shadow:
    0 0 10px #00ffcc,
    0 0 25px #00ffcc,
    0 0 50px #00c2a8;

  animation: glow 2.5s infinite alternate,
             pulse 3s infinite;
}

@keyframes glow{
  to{ text-shadow:0 0 55px #00c2a8; }
}

@keyframes pulse{
  50%{ transform:scale(1.06); }
}

/* Buttons */
.buttons{
  display:flex;
  gap:35px;
  justify-content:center;
}

button{
  padding:15px 42px;
  font-size:1.1rem;
  border:none;
  border-radius:40px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s ease;
}

#yesBtn{
  background:#00ff9c;
  color:#003b2a;
  box-shadow:0 0 20px rgba(0,255,160,0.7);
}

#noBtn{
  background:#ff4b4b;
  color:white;
  box-shadow:0 0 20px rgba(255,80,80,0.7);
}

button:hover{
  transform:scale(1.15);
}

/* Progress */
.progress-container{
  width:100%;
  height:10px;
  background:#1f2933;
  border-radius:10px;
  margin-top:30px;
  overflow:hidden;
  display:none;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00ff9c,#00c27a);
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="overlay">
  <h1 class="quest-title">ARE YOU READY FOR THE QUEST?</h1>

  <div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- Sounds -->
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="bgMusic" src="bg_music.mp3" loop></audio>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const clickSound = document.getElementById("clickSound");
const bgMusic = document.getElementById("bgMusic");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");

let musicStarted = false;

/* Start music on ANY user interaction */
function ensureMusic(){
  if(!musicStarted){
    bgMusic.volume = 0.6;
    bgMusic.play();
    musicStarted = true;
  }
}

/* One-time listeners */
["click","keydown","mousemove","touchstart"].forEach(evt=>{
  document.addEventListener(evt, ensureMusic, { once:true });
});

function playClick(){
  clickSound.currentTime = 0;
  clickSound.play();
}

/* YES */
yesBtn.onclick = () => {
  playClick();
  ensureMusic();
  progressContainer.style.display = "block";

  let progress = 0;
  const interval = setInterval(() => {
    progress += 4;
    progressBar.style.width = progress + "%";

    if(progress >= 100){
      clearInterval(interval);
      bgMusic.pause();          // 🔴 STOP MUSIC HERE
      bgMusic.currentTime = 0;
      window.location.href = "INDEX_DUMY3.html";
    }
  }, 100);
};

/* NO */
noBtn.onclick = () => {
  playClick();
  ensureMusic();
  setTimeout(()=> window.close(), 300);
};

/* 🎮 Keyboard support */
document.addEventListener("keydown", e => {
  if(e.key.toLowerCase() === "y") yesBtn.click();
  if(e.key.toLowerCase() === "n") noBtn.click();
});
</script>

</body>
</html>
